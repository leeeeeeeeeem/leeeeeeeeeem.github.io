name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push cancels a queued one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm run check

      # base_path is empty for a user site (leeeeeeeeeem.github.io); kept so a project site would work too.
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/
          include-hidden-files: true

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
